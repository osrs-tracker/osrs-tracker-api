name: zizmor

# Audits the workflows, the composite action and dependabot.yml for security problems: unpinned actions, template
# injection, broad permissions, persisted checkout credentials and more. Its findings fail the check. Every action,
# GitHub's included, is pinned by full SHA, which is zizmor's default policy, so it has no configuration file. Single
# findings are ignored where they are, with a `# zizmor: ignore[<audit>]` comment and the reason beside it:
# - artipacked and dangerous-triggers in deploy.yml (the deploy checkout's key and the workflow_run trigger)
# - self-repository on every `uses: ./.github/actions/setup-deps`: `uses: $/...` (GitHub, 2026-07-30) isn't understood
#   by actionlint yet (1.7.12 rejects it), and `./` only loads this repository's own commits. Revisit when actionlint
#   and Dependabot support it.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fail on findings: with true (the default) it only uploads them to code scanning and passes
          advanced-security: false
          # The default, latest, would let a new zizmor release fail the check by itself. Dependabot bumps the action's
          # SHA, not this: bump it by hand when a zizmor release matters
          version: 1.31.1
