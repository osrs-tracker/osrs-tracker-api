name: CI

on:
  push:
    branches: ['main']
    # Digest commits (and rollbacks) only change the manifest; skipping CI for them also skips the CD run it would
    # trigger. Not on pull_request: required checks that never report would block the PR. Keep in step with the
    # manifest pattern in the changes job.
    paths-ignore: ['osrs-tracker-api.yaml']
  pull_request:
    branches: ['main']

# Read-only unless a job asks for more: build and test run code from every installed package, so they get a token that
# can't push or approve pull requests, whatever the repository's default is
permissions:
  contents: read

jobs:
  # Build and test only run when something they depend on changed since the previous push, so commits like a deploy
  # digest or docs skip them. A skipped job still satisfies the required check; a workflow-level `paths` filter wouldn't.
  # The CD workflow only deploys a push to main when build ran, so this list includes everything that goes into the
  # image.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Check for source or dependency changes
        env:
          # A new push to a PR compares with the previous push, not the base branch, so a digest commit doesn't rerun
          # the build for the PR's earlier source changes
          BEFORE:
            ${{ (github.event_name == 'push' || github.event.action == 'synchronize') && github.event.before ||
            github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Digest commits get no CI run (paths-ignore above), so they have no results to compare with. Step back past
          # them to the last commit that went through CI, or the next push would rebuild (and redeploy) even for docs.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ]; then
            for _ in 1 2 3 4 5; do
              only=$(git diff --name-only "$BEFORE^" "$BEFORE" 2>/dev/null) || break
              printf '%s\n' "$only" | grep -q -v -E '^osrs-tracker-api\.yaml$' && break
              echo "$BEFORE only changes the manifest (no CI run), comparing with its parent."
              BEFORE=$(git rev-parse "$BEFORE^")
            done
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null); then
            echo "No previous commit to compare with, running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed files:\n%s\n' "$files"
          if printf '%s\n' "$files" \
            | grep -q -E '^(src/|\.github/|package(-lock)?\.json$|tsconfig[^/]*\.json$|nest-cli\.json$|rspack\.config\.js$|vitest\.config\.mjs$|Dockerfile$|\.dockerignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skipping is only safe if build and test passed (or were safely skipped) on the commit compared with;
          # otherwise a docs-only push after a failed build would turn the PR green
          previous=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?filter=latest&per_page=100" \
            --jq '[.check_runs[] | select(.name == "build" or .name == "test") | "\(.name)=\(.conclusion)"] | sort | join(" ")' \
            2>/dev/null) || true
          if [ "$previous" = "build=success test=success" ] || [ "$previous" = "build=skipped test=skipped" ]; then
            echo "No source or dependency changes and $BEFORE passed ($previous), skipping build and test."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "No source or dependency changes, but $BEFORE didn't pass build and test (${previous:-no results}), running them."
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm run lint:ci
      - run: npm run prettier:ci
      # Local links and #anchors in the Markdown, here because lint also runs for docs-only pushes. --hidden includes
      # .claude/; a glob input doesn't skip .gitignore'd paths, so node_modules is excluded by hand. --offline skips
      # external URLs, which would make CI flaky.
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --hidden --include-fragments --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  # Fails a PR that adds a dependency under a licence not in the list, so copyleft can't arrive unnoticed through
  # Dependabot or an agent. Not a required check: a failure is for the maintainer to judge. A missing licence is reported
  # without failing. sharp's prebuilt binaries are LGPL-3.0-or-later (libvips, loaded dynamically and unmodified), so
  # they're exempted by name rather than allowing LGPL for every package; version-less purls match every version.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: true
          vulnerability-check: false
          allow-licenses: >-
            MIT, MIT-0, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, MPL-2.0, Unlicense
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64, pkg:npm/@img/sharp-libvips-darwin-x64,
            pkg:npm/@img/sharp-libvips-linux-arm, pkg:npm/@img/sharp-libvips-linux-arm64,
            pkg:npm/@img/sharp-libvips-linux-ppc64, pkg:npm/@img/sharp-libvips-linux-riscv64,
            pkg:npm/@img/sharp-libvips-linux-s390x, pkg:npm/@img/sharp-libvips-linux-x64,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64, pkg:npm/@img/sharp-libvips-linuxmusl-x64,
            pkg:npm/@img/sharp-wasm32, pkg:npm/@img/sharp-win32-arm64, pkg:npm/@img/sharp-win32-ia32,
            pkg:npm/@img/sharp-win32-x64

  build:
    needs: changes
    # `!cancelled()` runs it when `changes` itself fails, so a broken check can't skip the build
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm run build
      # CD builds the image only after merging; build it here too, so a broken Dockerfile fails the PR, and check that
      # the image's sharp (installed apart from the bundle) loads and converts as the node user
      - name: Build the image
        run: docker build -t osrs-tracker-api:ci .
      - name: Check sharp in the image
        run: |
          docker run --rm --entrypoint node osrs-tracker-api:ci -e '
            if (require("os").userInfo().username !== "node") throw new Error("not running as node");
            const sharp = require("sharp");
            sharp({ create: { width: 2, height: 2, channels: 3, background: "red" } }).webp().toBuffer()
              .then((b) => console.log(`sharp ${sharp.versions.sharp} converted to ${b.length} bytes of webp`));'

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-deps # zizmor: ignore[self-repository]
      - run: npm test
