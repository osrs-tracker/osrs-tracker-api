# Weekly update PRs. CI runs on them like on any PR; merging one deploys (it changes package*.json, Dockerfile or
# .github/). Add their CHANGELOG.md entry when merging (see the osrs-tracker-api skill).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # No major PRs: a major needs migration work (code changes, peer dependencies moving together, e.g. NestJS 12
      # needing TypeScript 6) that a version bump can't do. Majors are done by hand from an issue. Also covers
      # @types/node, which follows the Node major in the Dockerfile and CI.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # typescript-eslint 8.71.x peers typescript <6.1.0, so a 6.1 bump fails `npm ci`. Remove once it allows 6.1
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The base image is pinned by digest, so this opens a PR when node:24-alpine is rebuilt (Node patches, Alpine fixes)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node majors also need CI's setup-node, engines and @types/node bumped: do them by hand
      - dependency-name: node
        update-types: [version-update:semver-major]
