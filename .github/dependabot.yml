# Weekly update PRs, each waiting 7 days after a release (cooldown), so a compromised release is usually pulled before
# we take it; Dependabot never applies a cooldown to security updates. CI runs on them like on any PR; merging one
# deploys (it changes package*.json, Dockerfile or .github/). A CHANGELOG.md entry follows only when a bump changes
# behaviour (see the osrs-tracker-api skill).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # No major PRs: a major needs migration work (code changes, peer dependencies moving together, e.g. NestJS 12
      # needing TypeScript 6) that a version bump can't do. Majors are done by hand from an issue. Also covers
      # @types/node, which follows the Node major in the Dockerfile and CI.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Keeps TypeScript on 6.0.x: no 6.1 will ship, so this blocks TypeScript 7. Neither typescript-eslint (peers
      # typescript <6.1.0) nor the Nest CLI (needs the compiler API, which 7.0 lacks; expected back in 7.1) accepts it
      # yet. Remove once both do, and upgrade by hand from an issue.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The base image is pinned by digest, so this opens a PR when node:26-alpine is rebuilt (Node patches, Alpine fixes)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Node majors also need CI's setup-node, engines and @types/node bumped: do them by hand
      - dependency-name: node
        update-types: [version-update:semver-major]
