apiVersion: v1
kind: Namespace
metadata:
  name: osrs-tracker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrs-tracker-api
  namespace: osrs-tracker
  labels:
    app: osrs-tracker-api
spec:
  replicas: 2
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: osrs-tracker-api
  template:
    metadata:
      labels:
        app: osrs-tracker-api
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
    spec:
      containers:
        - name: osrs-tracker-api
          image: freekmencke/osrs-tracker-api@sha256:a5d95aedd81aa7f18d869fc87a4cf523d548e89703efd1572a5cf2e7ca98a468
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: aws-mongodb-credentials
          env:
            - name: CORS_ORIGIN
              value: https://osrs-tracker.freekmencke.com
            - name: OSRS_API_BASE_URL
              value: https://runescape-api.freekmencke.com/rs
          ports:
            - containerPort: 3000
            - containerPort: 9090
          # Peak working set was 84Mi (Oct 2026, very low traffic); requests and limit leave room for growth, the 50MB
          # image cache and sharp's off-heap buffers. No CPU limit, so bursts aren't throttled.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          lifecycle:
            # Keep serving until Traefik has dropped the terminating pod, otherwise in-flight requests get a 502/504
            preStop:
              sleep:
                seconds: 5
          # /healthy only answers once MongoDB is connected (about 1s after the container starts), so allow 4.5 min for
          # the connect retries in mongo.provider.ts (230s at worst). Readiness and liveness only start once this passed.
          startupProbe:
            httpGet:
              path: /healthy
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 54
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9090
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthy
              port: 9090
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: osrs-tracker-api-service
  namespace: osrs-tracker
spec:
  selector:
    app: osrs-tracker-api
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osrs-tracker-api-ingress
  namespace: osrs-tracker
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # The Middlewares below: per-client-IP rate limits, then JSON compression (last, so rejected requests cost none).
    traefik.ingress.kubernetes.io/router.middlewares: osrs-tracker-osrs-tracker-api-ratelimit@kubernetescrd,osrs-tracker-osrs-tracker-api-inflight@kubernetescrd,osrs-tracker-osrs-tracker-api-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - osrs-tracker-api.freekmencke.com
      secretName: osrs-tracker-api-tls
  rules:
    - host: osrs-tracker-api.freekmencke.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: osrs-tracker-api-service
                port:
                  number: 3000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-api-ratelimit
  namespace: osrs-tracker
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 250
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-api-inflight
  namespace: osrs-tracker
spec:
  inFlightReq:
    amount: 50
---
# Compresses JSON for browsers (gzip, br or zstd per Accept-Encoding, bodies of 1024 bytes and up). Only JSON, so
# /news/image's WebP isn't compressed twice. The web's SSR calls the Service directly and gets plain JSON.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: osrs-tracker-api-compress
  namespace: osrs-tracker
spec:
  compress:
    includedContentTypes:
      - application/json
